# Self-hosted run: the app plus its own PostgreSQL. Free to run anywhere Docker works.
#   1. Create a .env next to this file (see .env.example) with at least POSTGRES_PASSWORD (and GROQ_API_KEY if you want the advisor).
#   2. docker compose up --build
#   3. Open http://localhost:3000
# This serves plain HTTP. Put a TLS-terminating reverse proxy in front before exposing it to the internet,
# and set TRUST_PROXY=true behind it (docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finvista
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: finvista
    volumes:
      - finvista-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finvista -d finvista"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://finvista:${POSTGRES_PASSWORD}@db:5432/finvista
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      TRUST_PROXY: ${TRUST_PROXY:-false}
volumes:
  finvista-data:
